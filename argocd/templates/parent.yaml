apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: Application-brain
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/org/test-repo.git
    targetRevision: main
    path: argocd
    helm:
      valueFiles:
        - values-{{ $.Values.image.environment }}.yaml
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
